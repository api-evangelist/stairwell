name: Stairwell
description: >-
  Stairwell is a private-by-design threat intelligence and detection platform that
  gives security teams a continuously reanalyzed, isolated store of their own files
  as an alternative to crowdsourced public services like VirusTotal. Its products
  span AI triage and static/behavioral malware analysis, malware variant discovery,
  Run-to-Ground incident scoping, and an encrypted Private Vault with retroactive
  detection as threat intelligence evolves. Stairwell exposes a REST API at
  app.stairwell.com/v1 (bearer-token auth) covering assets and forwarders, objects
  and detonation, sightings and variants, YARA rule management and ad-hoc scanning,
  threat reports and IOC correlation, network intelligence (hostname/IP/ASN WHOIS,
  cloud-provider lookups), plus outbound event-notification webhooks and an official
  hosted MCP server for read-only agent access. Added to the API Evangelist network
  from Accel's portfolio and enriched from Stairwell's public developer surface.
